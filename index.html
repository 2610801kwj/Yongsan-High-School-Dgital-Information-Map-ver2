<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 디지털 정보 지도</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 상단 안내 배너 - 화면 가로 기준 항상 정중앙 정렬 */
        #ui-layer {
            position: absolute; 
            top: 20px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 10; 
            pointer-events: none;
        }
        .title-box {
            display: inline-block; 
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }
        
        /* 중앙 정보 팝업창 스타일 */
        #popup {
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            background: white; 
            padding: 30px; 
            border-radius: 15px;
            display: none; 
            z-index: 100; 
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            text-align: center; 
            min-width: 280px;
        }
        #popup button { 
            margin-top: 20px; 
            padding: 10px 25px; 
            border: none;
            background: #4A90E2; 
            color: white; 
            border-radius: 5px; 
            cursor: pointer;
            font-weight: bold;
        }
        #popup button:hover {
            background: #357ABD;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="title-box">
            <h1 style="margin:0; font-size: 22px; color: #333;">🏫 학교 디지털 정보 지도</h1>
            <p style="margin:5px 0 0; font-size: 14px; color: #666;">건물을 클릭하여 정보를 확인하세요</p>
        </div>
    </div>

    <div id="popup">
        <h2 id="obj-name">시설 정보</h2>
        <p id="obj-desc">해당 구역의 상세 디지털 정보입니다.</p>
        <button id="close-btn">닫기</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 💡 [건물 한글 이름 설정 구역] 
        // 3D 파일 내의 메쉬 고유 이름에 따라 원하는 한글 이름과 설명을 매핑하세요.
        const buildingData = {
            "group_0_12568524": { name: "본관"},
            "group_1_14860437": { name: "대강당"},
            "group_2_15277357": { name: "비룡관"},
            "group_3_16448250": { name: "별관"},
            "group_4_16448250": { name: "과학관"},
            "group_5_16089887": { name: "용상"},
            "group_6_8273816": { name: "용상"},
            "group_7_3888547": { name: "운동장"},
            "group_8_8768998": { name: "농구장"},
            "group_9_8768998": { name: "족구장"}
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(50, 50, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const controls = new OrbitControls(camera, renderer.domElement);

        const mtlLoader = new MTLLoader();
        mtlLoader.load('./Fantastic Jofo-Lahdi.mtl', (materials) => {
            materials.preload();
            
            const objLoader = new OBJLoader();
            objLoader.setMaterials(materials);
            objLoader.load('./Fantastic Jofo-Lahdi.obj', (object) => {
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                object.position.sub(center);
                scene.add(object);
            });
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            // UI 레이어나 팝업 클릭 시 3D 클릭 연산 제외
            if (event.target.closest('#ui-layer') || event.target.closest('#popup')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            const popup = document.getElementById('popup');
            // 클릭이 시작되면 무조건 기존 팝업을 먼저 닫아서 여러 개 뜨는 버그 방지
            popup.style.display = 'none';

            if (intersects.length > 0) {
                const clickedObj = intersects[0].object;
                
                // 태블릿/PC의 F12 콘솔창에서 클릭한 건물 고유 명칭을 확인하는 용도입니다.
                console.log("클릭한 객체의 고유 ID/Name:", clickedObj.name);

                let displayName = "디지털 정보 구역";
                let displayDesc = "해당 구역의 상세 디지털 정보입니다.";

                // 매핑 테이블 데이터 매칭
                if (buildingData[clickedObj.name]) {
                    displayName = buildingData[clickedObj.name].name;
                    displayDesc = buildingData[clickedObj.name].desc;
                } else if (clickedObj.parent && buildingData[clickedObj.parent.name]) {
                    displayName = buildingData[clickedObj.parent.name].name;
                    displayDesc = buildingData[clickedObj.parent.name].desc;
                } else if (clickedObj.name) {
                    displayName = clickedObj.name;
                }
                
                // 하나의 단일 팝업창 내부 데이터 갱신 및 노출
                document.getElementById('obj-name').innerText = displayName;
                document.getElementById('obj-desc').innerText = displayDesc;
                popup.style.display = 'block';
            }
        });

        // 팝업 닫기 기능 추가
        document.getElementById('close-btn').addEventListener('click', () => {
            document.getElementById('popup').style.display = 'none';
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
